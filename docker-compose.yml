services:
  blackbeard-api:
    build: ./backend
    container_name: blackbeard-api
    environment:
      - PORT=3000
      - CONFIG_PATH=/config/config.json
      # Optional seeds for the very first run. Once you save settings in the UI,
      # /config/config.json becomes authoritative and these are ignored.
      # - SONARR_URL=http://sonarr:8989
      # - SONARR_API_KEY=
      # - RADARR_URL=http://radarr:7878
      # - RADARR_API_KEY=
      # - PROWLARR_URL=http://prowlarr:9696
      # - PROWLARR_API_KEY=
      # - BAZARR_URL=http://bazarr:6767
      # - BAZARR_API_KEY=
      # - QBITTORRENT_URL=http://qbittorrent:8080
      # - QBITTORRENT_USERNAME=admin
      # - QBITTORRENT_PASSWORD=
    volumes:
      - ./config:/config
      # Needed only for the "Restart container" / "Logs" diagnostics.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - servarr_default
    restart: always

  blackbeard-web:
    build: ./frontend
    container_name: blackbeard-web
    ports:
      - "8085:80"
    depends_on:
      - blackbeard-api
    networks:
      - servarr_default
    restart: always

  # Optional remote access via Cloudflare Tunnel. Start with:
  #   docker compose --profile cloudflare up -d
  # Set CLOUDFLARE_TUNNEL_TOKEN in a local .env (see .env.example). The public
  # hostname → http://blackbeard-web:80 mapping and the Cloudflare Access policy
  # are configured in the Cloudflare Zero Trust dashboard (see README).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: blackbear-cloudflared
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - blackbeard-web
    networks:
      - servarr_default
    restart: always
    profiles: ["cloudflare"]

# Join the existing servarr stack network so containers are reachable by name.
networks:
  servarr_default:
    external: true
