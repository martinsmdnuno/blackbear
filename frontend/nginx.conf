server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Interactive release search queries every indexer synchronously and can
    # take well over a minute — give it room before the generic /api/ timeout.
    location /api/releases/ {
        proxy_pass http://blackbeard-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # Proxy API calls to the backend container (same Docker network).
    location /api/ {
        proxy_pass http://blackbeard-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Hashed build assets are content-addressed — safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback. Never cache the HTML shell / root assets, so a rebuilt
    # frontend (with new asset hashes) is picked up on the next load instead of
    # serving a stale version.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
